<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Exit Planning Program</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FAF6EE; color: #1F1A14; }
  main { max-width: 420px; margin: 18vh auto 0; padding: 0 16px; text-align: center; line-height: 1.6; }
  a { color: #8A5528; }
  @media (prefers-color-scheme: dark) { body { background: #1C1008; color: #FFE4C0; } a { color: #E3A66A; } }
</style>
</head>
<body>
<main>
  <p>The exit planning program has moved to <a id="go" href="https://furvival.com/exitplanning/">furvival.com/exitplanning</a>. Taking you there now.</p>
</main>
<script>
/* Hands progress, saved passages and sync settings stored on this domain to the new address,
   in the URL hash (never sent to a server). The new page reads it, removes it from the address bar, and merges it. */
(function(){
  var NEW = 'https://furvival.com/exitplanning/';
  var to = location.hash && location.hash.charAt(1) === '/' ? location.hash : '#/';
  var link = document.getElementById('go'); link.href = NEW + to;
  function go(h){ location.replace(NEW + h); }
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function parse(v){ try{ return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  if(get('fbe.movedAt')) return go(to);
  var st = parse(get('fbe.state.v1')), sc = parse(get('fbe.sync.v1')), th = get('fbe.theme');
  if(!st && !(sc && sc.token)) return go(to);
  var payload = JSON.stringify({s: st, c: sc && sc.token ? {token: sc.token, gistId: sc.gistId || null} : null, th: th});
  function b64url(bytes){
    var bin = '', CH = 0x8000;
    for(var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  var raw = new TextEncoder().encode(payload);
  var packed = typeof CompressionStream === 'function'
    ? new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer().then(function(b){ return {d: b64url(new Uint8Array(b)), z: 1}; })
    : Promise.resolve({d: b64url(raw), z: 0});
  packed.then(function(p){
    try{ localStorage.setItem('fbe.movedAt', String(Date.now())); }catch(e){}
    go('#move=' + p.d + '&z=' + p.z + '&to=' + encodeURIComponent(to));
  }).catch(function(){ go(to); });
})();
</script>
</body>
</html>
